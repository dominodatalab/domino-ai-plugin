schema_version: '1.1'
name: launch-vscode-workspace-ssh
description: 'Workspaces: launch flow (environment, IDE, hardware tier) and SSH via Enable SSH access plus the Dom CLI; no python-domino workspace_start.'
tags: [trigger, domino-workspaces, workspaces]
execution:
  max_turns: 10
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: |
    How do I launch a VS Code workspace on a GPU hardware tier in Domino and then connect my local VS
    Code to it over SSH? Put the code in your reply, not in files.
graders:
- name: launch-and-ssh
  type: llm
  criteria: |
    PASS if the reply (a) launches the workspace from the project's Workspaces page choosing a compute environment, the VS Code IDE and a GPU hardware tier, and (b) for SSH says to enable SSH access when launching (the "Enable SSH access" setting, with an SSH-capable environment), then connect using the Dom CLI (`dom connect <workspace_id> ...`, which writes an SSH config) together with the VS Code Remote - SSH extension.
    FAIL if it offers a python-domino `workspace_start(...)` call, or tells the user to ssh directly to a workspace hostname with a key file without the Dom CLI step.
- name: no-invented-sdk
  type: regex
  target: last_message
  match: not_contains
  pattern: \.workspace_(start|stop)\(
- name: skill-fired
  type: tool_used
  tool: Skill
  input_match: '"skill"\s*:\s*"(?:[\w-]+:)?(domino-workspaces)"'
