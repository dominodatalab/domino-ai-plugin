schema_version: '1.1'
name: trace-deployed-app-performance-tab
description: 'GenAI tracing in production: @add_tracing alone is enough for a deployed app; DominoRun/DominoAgentContext is optional there.'
tags: [trigger, domino-genai-tracing, genai]
context:
  scaffold_script: fixture.sh
execution:
  max_turns: 15
  allowed_tools: [Read, Glob, Grep, Skill, Write, Edit]
  prompt: |
    This FastAPI chat service will be deployed as a Domino App. Edit main.py in place so its LLM calls
    are traced and show up in Domino for the deployed app, and tell me whether I need a DominoRun /
    DominoAgentContext around each request.
graders:
- name: add-tracing
  type: regex
  target: {source: file, path: main.py}
  pattern: add_tracing
- name: production-mode
  type: llm
  criteria: |
    PASS if the reply says that in a deployed app `DominoRun` / `DominoAgentContext` is not required around each request: the `@add_tracing` decorator (with framework autologging) alone captures production traces, which Domino shows for the deployed app.
    FAIL if it says every request must be wrapped in `DominoRun` or `DominoAgentContext` for traces to appear for the deployed app.
- name: skill-fired
  type: tool_used
  tool: Skill
  input_match: '"skill"\s*:\s*"(?:[\w-]+:)?(domino-genai-tracing|domino-trace-setup)"'
