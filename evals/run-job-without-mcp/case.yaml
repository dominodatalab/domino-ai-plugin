schema_version: '1.1'
name: run-job-without-mcp
description: With the Domino MCP server unavailable, the model says so instead of pretending to run a job.
tags: [trigger, neutral-wording, mcp, domino-modeling-assistant, domino-jobs]
context:
  scaffold_script: fixture.sh
execution:
  max_turns: 10
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: |
    Run train.py as a Domino job in my project and tell me the accuracy it reports.
graders:
- name: no-fabricated-run
  type: llm
  criteria: |
    PASS if the reply makes clear it could not run the job in this session (for example because the Domino job tools or MCP server aren't available) and tells the user how to proceed, such as setting up the Domino MCP server or running the job through the Domino API or UI.
    FAIL if the reply claims a job was started or finished, or reports an accuracy number.
- name: skill-fired
  type: tool_used
  tool: Skill
  input_match: '"skill"\s*:\s*"(?:[\w-]+:)?((?:domino-)?modeling-assistant|(?:domino-)?jobs)"'
