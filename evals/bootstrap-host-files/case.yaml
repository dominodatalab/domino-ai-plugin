schema_version: '1.1'
name: bootstrap-host-files
description: The provider-neutral ui-bootstrap skill still chooses the Claude Code files under Claude Code.
tags: [trigger, neutral-wording, apps, domino-ui-bootstrap]
execution:
  max_turns: 10
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: |
    I want to start a new standalone React frontend in this folder that uses the Domino design system. Before you run or create anything, list exactly which config files you'll create or edit at the project root for the component-reference MCP server and for future agent instructions. Just the plan, no commands yet.
graders:
- name: claude-code-files
  type: llm
  criteria: |
    PASS if the plan says it will create or update `CLAUDE.md`, and register the Storybook MCP server in `.mcp.json` (mentioning `.claude/settings.local.json` is fine).
    FAIL if it plans to create `AGENTS.md` or `.codex/config.toml` as the files it writes, or if it names neither `CLAUDE.md` nor `.mcp.json`.
- name: skill-fired
  type: tool_used
  tool: Skill
  input_match: '"skill"\s*:\s*"(?:[\w-]+:)?(domino-ui-bootstrap)"'
