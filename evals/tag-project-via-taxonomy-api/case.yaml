schema_version: '1.1'
name: tag-project-via-taxonomy-api
description: 'Tags and properties: /api/taxonomy/v1 tag lookup, rpc/tag-entity with entityType/entityId/tagIds, and entities-by-tag query.'
tags: [trigger, tags-and-properties, taxonomy]
execution:
  max_turns: 12
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: |
    Tag my current Domino project with the `clinical` tag from the `domain` namespace using the Taxonomy
    API, then list every project that carries that tag. curl is fine. Put the code in your reply, not in
    files.
graders:
- name: entity-type
  type: regex
  target: last_message
  pattern: entityType
- name: no-api-key
  type: regex
  target: last_message
  match: not_contains
  pattern: X-Domino-Api-Key\\?[\x27"]?\s*:|-H\s*\\?[\x27"]X-Domino-Api-Key|DOMINO_USER_API_KEY\s*=|DOMINO_API_KEY\s*=
- name: skill-fired
  type: tool_used
  tool: Skill
  input_match: '"skill"\s*:\s*"(?:[\w-]+:)?(tags-and-properties)"'
- name: tag-entity-rpc
  type: regex
  target: last_message
  pattern: rpc/tag-entity
- name: tag-flow
  type: llm
  criteria: |
    PASS if the reply (a) resolves the tag to its id first (for example `GET /api/taxonomy/v1/tags/autocomplete?q=clinical` or listing the `domain` namespace's tags), (b) applies it with `POST /api/taxonomy/v1/rpc/tag-entity` and a body with `entityType` `project`, `entityId` `$DOMINO_PROJECT_ID` and `tagIds` as an array of ids, and (c) lists tagged projects with `GET /api/taxonomy/v1/tags/{tagId}/entities` or `GET /api/taxonomy/v1/entities?tagIds=...&entityTypes=project`, using `$DOMINO_API_PROXY` without a header or a bearer token from `http://localhost:8899/access-token`.
    FAIL if it tags by label instead of id in the request body, uses an API key, or invents routes outside `/api/taxonomy/v1`.
- name: taxonomy-base
  type: regex
  target: last_message
  pattern: /api/taxonomy/v1
