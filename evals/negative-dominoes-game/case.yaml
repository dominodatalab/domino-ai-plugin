schema_version: '1.1'
name: negative-dominoes-game
description: 'Negative: the word domino in a board-game request must not load a Domino Data Lab skill.'
tags: [negative]
execution:
  max_turns: 5
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: |
    Write a Python class for a game of dominoes: generate the 28 double-six tiles, shuffle them, deal
    seven to each of two players and keep the rest as the boneyard.
graders:
- name: no-domino-skill
  type: tool_used
  tool: Skill
  input_match: '"skill"\s*:\s*"(?:[\w-]+:)?(domino-|netapp-volumes|tags-and-properties)'
  min: 0
  max: 0
  arm: both
