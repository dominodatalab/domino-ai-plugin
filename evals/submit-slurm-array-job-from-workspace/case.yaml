schema_version: '1.1'
name: submit-slurm-array-job-from-workspace
description: 'HPC Slurm: a parameter sweep as a Slurm array job from a Domino Workspace with a Slurm cluster attached; output goes to the Dataset, submit and monitor with sbatch, squeue and sacct.'
tags: [trigger, domino-hpc-slurm, clusters]
execution:
  max_turns: 10
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: |
    I have a Domino Workspace with a Slurm cluster attached. Write me a job script that runs
    `python3 simulate.py --seed N` for N = 1 to 10 as a Slurm array job on Domino and keeps each
    task's output where I can read it afterwards from the Workspace, then tell me how to submit it and
    how to check on it while it runs and after it finishes. Put the script and the commands in your
    reply, not in files.
graders:
- name: array-directive
  type: regex
  target: last_message
  pattern: --array=1-10
- name: monitor-commands
  type: regex
  target: last_message
  pattern: \bsqueue\b[\s\S]*\bsacct\b|\bsacct\b[\s\S]*\bsqueue\b
- name: no-other-frameworks
  type: regex
  target: last_message
  match: not_contains
  pattern: \bmpirun\b|ray\.init\(|dask\.distributed
- name: output-on-dataset
  type: regex
  target: last_message
  pattern: /domino/datasets/|/mnt/data/
- name: sbatch-submit
  type: regex
  target: last_message
  pattern: \bsbatch\b
- name: skill-fired
  type: tool_used
  tool: Skill
  input_match: '"skill"\s*:\s*"(?:[\w-]+:)?(domino-hpc-slurm)"'
- name: task-id-variable
  type: regex
  target: last_message
  pattern: SLURM_ARRAY_TASK_ID
