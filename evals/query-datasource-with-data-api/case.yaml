schema_version: '1.1'
name: query-datasource-with-data-api
description: 'Data SDK: DataSourceClient().get_datasource(name).query(...).to_pandas() and object-store list_objects; no Feature Store.'
tags: [trigger, domino-data-sdk, data]
execution:
  max_turns: 10
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: |
    With the Domino Data API Python library, run `SELECT * FROM orders LIMIT 100` against our Snowflake
    data source `snowflake-prod` and get a pandas DataFrame. Then list the objects under `raw/` in our
    S3 data source `landing-zone`. Put the code in your reply, not in files.
graders:
- name: client-import
  type: regex
  target: last_message
  pattern: from domino(_data)?\.data_sources import DataSourceClient
- name: get-datasource
  type: regex
  target: last_message
  pattern: get_datasource\(
- name: list-objects
  type: regex
  target: last_message
  pattern: list_objects\(
- name: no-api-key
  type: regex
  target: last_message
  match: not_contains
  pattern: X-Domino-Api-Key\\?[\x27"]?\s*:|-H\s*\\?[\x27"]X-Domino-Api-Key|DOMINO_USER_API_KEY\s*=|DOMINO_API_KEY\s*=|api_key\s*=
- name: no-feature-store
  type: regex
  target: last_message
  match: not_contains
  pattern: domino(_data)?\.feature_store|FeatureStore(Client)?\(|feature_store\.\w+\(
- name: skill-fired
  type: tool_used
  tool: Skill
  input_match: '"skill"\s*:\s*"(?:[\w-]+:)?(domino-data-sdk)"'
- name: to-pandas
  type: regex
  target: last_message
  pattern: to_pandas\(
