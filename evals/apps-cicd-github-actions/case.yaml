schema_version: '1.1'
name: apps-cicd-github-actions
description: 'Disambiguation: app CI/CD loads domino-apps and restarts the App with POST /api/apps/beta/apps/{appId}/versions and a service-account token or user API key secret.'
tags: [trigger, domino-apps, apps, disambiguation]
execution:
  max_turns: 15
  allowed_tools: [Read, Glob, Grep, Skill, Write, Edit]
  prompt: |
    Write a GitHub Actions workflow to .github/workflows/publish-domino-app.yml that publishes a new
    version of my existing Domino App (app id 68b1c2d3e4f5a6b7c8d9e0f1) on every push to main, using the
    Domino REST API.
graders:
- name: apps-beta-or-sdk
  type: regex
  target: {source: file, path: .github/workflows/publish-domino-app.yml}
  pattern: /api/apps/beta|deploy_app\.py
- name: no-apps-v1
  type: regex
  target: {source: file, path: .github/workflows/publish-domino-app.yml}
  match: not_contains
  pattern: /api/apps/v1
- name: cicd-auth
  type: llm
  focus: {source: file, path: .github/workflows/publish-domino-app.yml}
  criteria: |
    PASS if the workflow reads a Domino service-account token (sent as `Authorization: Bearer`) or a user API key (sent as `X-Domino-Api-Key`) from a GitHub secret, targets the deployment's public URL, and starts the existing App on the new commit by creating a version with `POST /api/apps/beta/apps/{appId}/versions` (directly or in a script the workflow runs).
    FAIL if it uses `/api/apps/v1` routes, starts the App with python-domino `app_publish` or a `/v4/modelProducts` route, relies on `DOMINO_API_PROXY` or `localhost:8899` from GitHub Actions, hard-codes the credential, or leaves the deployment step as a placeholder that prints success without calling the API.
- name: not-app-init
  type: tool_used
  tool: Skill
  input_match: '"skill"\s*:\s*"(?:[\w-]+:)?(domino-app-init)"'
  min: 0
  max: 0
  arm: both
- name: not-debug-proxy
  type: tool_used
  tool: Skill
  input_match: '"skill"\s*:\s*"(?:[\w-]+:)?(domino-debug-proxy)"'
  min: 0
  max: 0
  arm: both
- name: skill-fired
  type: tool_used
  tool: Skill
  input_match: '"skill"\s*:\s*"(?:[\w-]+:)?(domino-apps)"'
