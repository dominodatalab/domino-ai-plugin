schema_version: '1.1'
name: mcp-server-from-laptop
description: 'Modeling assistant: outside Domino the MCP server authenticates with a service-account token, or a user API key as the fallback.'
tags: [trigger, domino-modeling-assistant, mcp]
execution:
  max_turns: 10
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: |
    I want my coding assistant on my laptop (outside Domino) to run jobs in my Domino project
    `alice/churn` through the Domino MCP server. What do I configure, and which credential should it
    use?
graders:
- name: domino-token
  type: regex
  target: last_message
  pattern: DOMINO_TOKEN
- name: laptop-auth
  type: llm
  criteria: |
    PASS if the reply configures the Domino MCP server for the user's assistant (the plugin's bundled server, or its registration steps) with the deployment URL in `DOMINO_HOST` and a Domino service-account token in `DOMINO_TOKEN` (sent as `Authorization: Bearer`) or, without one, a user API key in `DOMINO_API_KEY` (sent as `X-Domino-Api-Key`), for project `alice/churn`.
    FAIL if it tells the user to create a Personal Access Token, or says the server accepts no token outside Domino.
- name: pat-or-sa
  type: regex
  target: last_message
  flags: i
  pattern: service account|DOMINO_API_KEY
- name: skill-fired
  type: tool_used
  tool: Skill
  input_match: '"skill"\s*:\s*"(?:[\w-]+:)?(domino-modeling-assistant)"'
