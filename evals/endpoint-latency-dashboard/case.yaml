schema_version: '1.1'
name: endpoint-latency-dashboard
description: 'Disambiguation: an endpoint monitoring question loads domino-model-endpoints, not the REST lifecycle skill.'
tags: [trigger, domino-model-endpoints, model-deployment, disambiguation]
execution:
  max_turns: 10
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: |
    The p99 latency of my production Domino endpoint doubled overnight. Where in Domino do I look at its
    latency, error-rate and resource graphs, and how do I get alerted next time?
graders:
- name: monitoring-answer
  type: llm
  criteria: |
    PASS if the reply points the user at the endpoint's own monitoring in Domino (the endpoint page's performance metrics, status codes, health checks and logs, which every user can see) and, for detailed dashboards and alerting, says that the Grafana dashboards and alert configuration are for Domino administrators (so a non-admin works with their admin or IT team on alert thresholds).
    FAIL if it only gives REST deployment automation, tells a non-admin to build Grafana alerts themselves without noting the admin requirement, or invents Kubernetes autoscaling as the fix.
- name: not-model-serving
  type: tool_used
  tool: Skill
  input_match: '"skill"\s*:\s*"(?:[\w-]+:)?(domino-model-serving)"'
  min: 0
  max: 0
  arm: both
- name: skill-fired
  type: tool_used
  tool: Skill
  input_match: '"skill"\s*:\s*"(?:[\w-]+:)?(domino-model-endpoints)"'
