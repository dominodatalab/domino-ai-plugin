schema_version: '1.1'
name: unrelated-request
description: Negative case; no Domino skill should fire on a generic coding question.
tags: [negative]
execution:
  max_turns: 5
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: |
    Write a Python function that reverses a singly linked list, with a short example.
graders:
- name: no-domino-skill
  type: tool_used
  tool: Skill
  input_match: '"skill"\s*:\s*"(?:[\w-]+:)?(domino-|netapp-volumes|tags-and-properties)'
  min: 0
  max: 0
  arm: both
