schema_version: '1.1'
name: add-genai-tracing
description: Tracing setup adds the Domino SDK decorator and run context to an OpenAI agent.
tags: [trigger, converted-command, genai, domino-trace-setup, domino-genai-tracing]
context:
  scaffold_script: fixture.sh
execution:
  max_turns: 15
  allowed_tools: [Read, Glob, Grep, Skill, Write, Edit]
  prompt: |
    I run this little OpenAI agent in Domino. Instrument agent.py in place so I can see each LLM call and its latency in Domino, grouped as one run.
graders:
- name: domino-run-context
  type: regex
  target: {source: file, path: agent.py}
  pattern: DominoRun|DominoAgentContext
- name: domino-tracing-api
  type: regex
  target: {source: file, path: agent.py}
  pattern: add_tracing
- name: skill-fired
  type: tool_used
  tool: Skill
  input_match: '"skill"\s*:\s*"(?:[\w-]+:)?(domino-trace-setup|(?:domino-)?genai-tracing)"'
