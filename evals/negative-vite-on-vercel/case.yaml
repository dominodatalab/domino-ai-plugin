schema_version: '1.1'
name: negative-vite-on-vercel
description: 'Negative: a blank-page Vite deployment on Vercel must not load the Domino proxy-debugging skills.'
tags: [negative]
execution:
  max_turns: 5
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: |
    My Vite + React app deployed to Vercel shows a blank page and the console says the JS and CSS files
    are 404. What are the usual causes and fixes on Vercel?
graders:
- name: no-domino-skill
  type: tool_used
  tool: Skill
  input_match: '"skill"\s*:\s*"(?:[\w-]+:)?(domino-|netapp-volumes|tags-and-properties)'
  min: 0
  max: 0
  arm: both
