id: s12-hpc-submit
title: Submit an sbatch script as an HPC Job by API (on a deployment without a Slurm data plane)
journey: HPC / Slurm
project_type: dfs
expected_skills: [domino-hpc-slurm]
timeout_s: 1200
setup:
  - type: ws_file
    path: '{{run_dir}}/hpc/sweep.sh'
    content: |
      #!/bin/bash
      #SBATCH --job-name=sweep
      #SBATCH --array=0-3
      #SBATCH --time=00:10:00
      umask 077
      OUT={{dataset_path}}
      echo "task $SLURM_ARRAY_TASK_ID on $(hostname)" > "$OUT/sweep_$SLURM_ARRAY_TASK_ID.txt"
prompt: |
  There's an sbatch array script at hpc/sweep.sh in my working directory. Submit it to Domino as an HPC
  job with 4 CPUs and a 2-hour time limit, then tell me its status.
check:
  - type: skill_loaded
    skill_regex: 'domino-hpc-slurm'
    only_builds: [next]
  - type: tool_io_regex          # checked support and/or attempted the HPC start
    input_regex: 'hpc/v1/jobs/submit-supported|dataplanes|/api/hpc/v1/jobs'
    output_regex: '.'
  - type: conditional_io         # if it attempted the start: correct body, script uploaded first
    when_input_regex: '/api/hpc/v1/jobs(?![/\w-])'
    require_input_regex: ['filePath', 'dataPlaneId', '"?cpu"?\\?"?\s*[:=]\s*4\b', '02:00:00']
    forbid_input_regex: ['"?filePath"?\\?"?\s*[:=]\s*\\?"(/|\.?/mnt)']
    before_input_regex: 'sync_local_file_to_domino|upload_file_to_domino_project|smart_sync_file|files_upload|/v1/projects/[^"]+/sweep'
  - type: tool_io_regex          # no fallback to a standard Job with clusterType slurm (or any cluster)
    input_regex: '/api/jobs/v1/jobs[^\n]{0,400}(?i:slurm|computeCluster)'
    output_regex: '.'
    expect: absent
  - type: nothing_started        # no standard Job, no HPC Job, no new Workspace
  - type: reply_regex            # honest: submission is not available here
    patterns: ['(?i)(not (currently )?(enabled|available|supported|possible)|unavailable|no slurm|isn.t (enabled|available|supported)|supported.{0,15}false|cannot|can.t|could not|couldn.t|failed|error|503|500)']
  - type: reply_not_regex        # no claimed success or invented job id
    patterns:
      - '(?i)\b(successfully submitted|has been submitted|was submitted successfully|submitted successfully)\b'
      - '(?i)\bstatus\b[^.\n]{0,20}\b(Submitted|Running|Queued|Pending)\b'
cleanup: []
