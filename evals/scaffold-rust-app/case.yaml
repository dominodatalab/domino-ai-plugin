schema_version: '1.1'
name: scaffold-rust-app
description: 'Rust Apps: a new Rust web service is scaffolded with a pinned toolchain, strict lints and an app.sh that runs a prebuilt binary instead of compiling.'
tags: [trigger, domino-rust-apps, apps, rust]
context:
  scaffold_script: fixture.sh
execution:
  max_turns: 40
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Skill, Write, Edit]
  prompt: |
    Set up a new Rust web service in this folder that I can publish as a Domino App. It should show a simple
    status page and a JSON health check. We care a lot about correctness here, so use strict linting and a
    pinned toolchain. Tell me what I need to do in Domino before I can publish it.
graders:
- name: app-sh-no-compile
  type: regex
  target: {source: file, path: app.sh}
  match: not_contains
  pattern: cargo\s+(\+\S+\s+)?(build|run|install)
- name: build-once-explained
  type: llm
  criteria: |
    PASS if the reply tells the user (1) that the Rust toolchain must be in the Project's Compute Environment (or
    gives the environment build steps), and (2) that the binary is built once in a Workspace or Job and saved,
    after which the App (Preview and deployments) runs that prebuilt binary through app.sh without compiling.
    FAIL if it tells the user to compile with cargo inside app.sh, or never mentions how the toolchain gets into
    the environment.
- name: clippy-pedantic
  type: regex
  target: {source: file, path: Cargo.toml}
  pattern: pedantic\s*=\s*\{[^}]*priority\s*=\s*-1
- name: gitignore-target
  type: regex
  target: {source: file, path: .gitignore}
  pattern: (^|\n)/?target/?[ \t]*(\r?\n|$)
- name: port-8888
  type: regex
  target: {source: file, path: src/main.rs}
  pattern: '8888'
- name: skill-fired
  type: tool_used
  tool: Skill
  input_match: '"skill"\s*:\s*"(?:[\w-]+:)?(domino-rust-apps)"'
- name: toolchain-pinned
  type: regex
  target: {source: file, path: rust-toolchain.toml}
  pattern: channel\s*=\s*"\d+\.\d+\.\d+"
