schema_version: '1.1'
name: negative-ray-vs-dask-own-k8s
description: 'Negative: a Ray-vs-Dask comparison on the user''s own Kubernetes cluster is not a Domino question.'
tags: [negative]
execution:
  max_turns: 5
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: |
    We run our own Kubernetes cluster, no Domino. For a pandas-heavy ETL that occasionally trains an
    XGBoost model, should we pick Ray or Dask, and why? Keep it to a short comparison.
graders:
- name: no-domino-skill
  type: tool_used
  tool: Skill
  input_match: '"skill"\s*:\s*"(?:[\w-]+:)?(domino-|netapp-volumes|tags-and-properties)'
  min: 0
  max: 0
  arm: both
