schema_version: '1.1'
name: run-existing-sbatch-scripts-on-domino
description: 'Disambiguation: a pile of existing sbatch scripts from a university HPC cluster is a domino-hpc-slurm request; domino-distributed-computing (Spark, Ray, Dask, MPI) must not fire.'
tags: [disambiguation, domino-hpc-slurm, domino-distributed-computing]
execution:
  max_turns: 10
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: |
    Our group has a pile of sbatch scripts from the university HPC cluster: parameter sweeps and a
    few Monte Carlo ensembles, nothing MPI. We now have Domino. What do we need in place, and how do
    we run those scripts on Domino with as little change as possible? Keep it to the essentials.
graders:
- name: dataset-shared-storage
  type: regex
  target: last_message
  pattern: (?i)\bdatasets?\b
- name: no-distributed-computing
  type: tool_used
  tool: Skill
  input_match: '"skill"\s*:\s*"(?:[\w-]+:)?(domino-distributed-computing)"'
  min: 0
  max: 0
  arm: both
- name: no-other-frameworks
  type: regex
  target: last_message
  match: not_contains
  pattern: \bmpirun\b|SparkSession|ray\.init\(
- name: sbatch-in-answer
  type: regex
  target: last_message
  pattern: \bsbatch\b
- name: skill-fired
  type: tool_used
  tool: Skill
  input_match: '"skill"\s*:\s*"(?:[\w-]+:)?(domino-hpc-slurm)"'
