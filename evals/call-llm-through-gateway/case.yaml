schema_version: '1.1'
name: call-llm-through-gateway
description: A script that calls OpenAI directly is rewritten to call a gateway alias through Domino LLM Gateway 2.0 with the in-run access token.
tags: [llm, gateway]
context:
  scaffold_script: fixture.sh
execution:
  max_turns: 15
  allowed_tools: [Read, Glob, Grep, Skill, Write, Edit]
  prompt: |
    Our Domino admin deployed LLM Gateway 2.0 and gave us the alias `support-llm`. The gateway URL is in the project environment variable `LLM_GATEWAY_URL`. Change `ask.py` so it calls the alias through the gateway when it runs as a Domino Job, without putting any provider key in the code.
graders:
- name: gateway-auth
  type: regex
  target: {source: file, path: ask.py}
  pattern: access-token[\s\S]*LLM_GATEWAY_URL|LLM_GATEWAY_URL[\s\S]*access-token
- name: skill-fired
  type: tool_used
  tool: Skill
  input_match: '"skill"\s*:\s*"(?:[\w-]+:)?domino-llm-gateway"'
- name: uses-alias-no-provider-key
  type: llm
  criteria: |
    PASS if the rewritten `ask.py` sends requests to the gateway URL taken from the `LLM_GATEWAY_URL` environment variable (with `/v1` for an OpenAI-style client), uses the alias `support-llm` as the model, authenticates with a bearer token read from the Domino access-token endpoint (`$DOMINO_API_PROXY/access-token` or `http://localhost:8899/access-token`) at call time rather than once at import, and no longer reads `OPENAI_API_KEY` or any other provider key.
    FAIL if a provider API key remains in the code, if the model is still a vendor model name, if the token is fetched once and cached for the life of the process, or if a legacy Domino user API key (`DOMINO_USER_API_KEY`, `X-Domino-Api-Key`) is used.
