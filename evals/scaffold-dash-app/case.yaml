schema_version: '1.1'
name: scaffold-dash-app
description: 'Disambiguation: a new Dash app loads domino-app-init and app.py uses app.run with DOMINO_RUN_HOST_PATH routing, not run_server.'
tags: [trigger, domino-app-init, apps, disambiguation]
execution:
  max_turns: 15
  allowed_tools: [Read, Glob, Grep, Skill, Write, Edit]
  prompt: |
    Start a brand-new Dash app for Domino in this empty folder: app.py, which binds the server itself,
    and an app.sh that just runs it, ready to publish.
graders:
- name: app-run
  type: regex
  target: {source: file, path: app.py}
  pattern: app\.run\(
- name: binds-all-interfaces
  type: regex
  target: {source: file, path: app.py}
  pattern: 0\.0\.0\.0
- name: host-path-routing
  type: regex
  target: {source: file, path: app.py}
  pattern: DOMINO_RUN_HOST_PATH
- name: no-run-server
  type: regex
  target: {source: file, path: app.py}
  match: not_contains
  flags: m
  pattern: ^(?!\s*#).*\.run_server\(
- name: not-debug-proxy
  type: tool_used
  tool: Skill
  input_match: '"skill"\s*:\s*"(?:[\w-]+:)?(domino-debug-proxy)"'
  min: 0
  max: 0
  arm: both
- name: port-8888
  type: regex
  target: {source: file, path: app.py}
  pattern: '8888'
- name: requests-prefix
  type: regex
  target: {source: file, path: app.py}
  pattern: requests_pathname_prefix
- name: skill-fired
  type: tool_used
  tool: Skill
  input_match: '"skill"\s*:\s*"(?:[\w-]+:)?(domino-app-init)"'
