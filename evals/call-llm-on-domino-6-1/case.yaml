schema_version: '1.1'
name: call-llm-on-domino-6-1
description: 'LLM access on self-managed Domino 6.1: the AI Gateway or a provider key in a Domino env var; no LLM Gateway 2.0 or hosted LLMs.'
tags: [trigger, domino-llm-access, llms, compat]
execution:
  max_turns: 10
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: |
    Our self-managed Domino is version 6.1. Which options do I have to call an external LLM provider
    (Anthropic) from a Workspace, and which one should I use by default?
graders:
- name: gated-answer
  type: llm
  criteria: |
    PASS if the reply offers the Domino AI Gateway ("Gateway LLMs") as the governed option where an administrator has set up an endpoint for Anthropic and the provider SDK with the API key stored as a Domino environment variable (read via os.environ) as the alternative, with a clear default.
    FAIL if it presents LLM Gateway 2.0 or Domino-hosted LLM endpoints (Host an LLM, /api/gen-ai) as available on 6.1, says the AI Gateway is always available without admin-created endpoints, tells the user to enable the gateway, or tells the user to hard-code the key.
- name: skill-fired
  type: tool_used
  tool: Skill
  input_match: '"skill"\s*:\s*"(?:[\w-]+:)?(domino-llm-access)"'
