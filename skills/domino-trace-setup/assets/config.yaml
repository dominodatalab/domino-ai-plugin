# Domino agent configuration
# Used with: DominoAgentContext(agent_config_path="config.yaml")  (or DominoRun)
#
# The SDK flattens this file (dotted keys, for example models.primary) and logs every
# value as an MLflow parameter on the evaluation run, so any run can be reproduced from
# its parameters in the Domino UI. Without agent_config_path the SDK reads the path in
# DOMINO_AGENT_CONFIG_PATH, defaulting to ./agent_config.yaml.
#
# Replace the model names with the ones the agent actually calls (gateway aliases when the
# agent calls LLM Gateway 2.0, the served model name for a Domino-hosted endpoint).

models:
  # Model the agent calls
  primary: gpt-4o-mini

  # Model used by the LLM-as-judge evaluator; must match the judge_model passed to
  # create_llm_judge_evaluator() (or the JUDGE_MODEL environment variable)
  judge: gpt-4o-mini

agents:
  # Default settings for all agents
  default:
    temperature: 0.7
    max_tokens: 1000
    timeout_seconds: 30

  classifier:
    temperature: 0.3
    max_tokens: 500
    system_prompt: "You are a classifier. Categorize inputs accurately."

  responder:
    temperature: 0.7
    max_tokens: 1500
    system_prompt: "You are a helpful assistant. Provide clear, accurate responses."

  evaluator:
    temperature: 0
    max_tokens: 10
    system_prompt: "You are an evaluator. Rate responses objectively."

evaluation:
  # Add the LLM-as-judge evaluator to @add_tracing
  enable_llm_judge: true

  # Quality thresholds your own code can read
  thresholds:
    minimum_quality: 0.7
    minimum_confidence: 0.8

settings:
  retry_count: 3
  timeout_seconds: 30
  batch_size: 10
  verbose: false
