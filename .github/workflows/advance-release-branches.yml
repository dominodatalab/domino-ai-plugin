name: Advance release branches

# main is correct for every Domino line at or above its floor (the DDD in plugin.json's
# version, e.g. 603 = Domino 6.3). Each release-X.Y branch for such a line must therefore equal
# main, because the Domino Workspace updater and pinned installs resolve release-X.Y by name.
# On every push to main this fast-forwards each existing release-X.Y whose line is at or above
# main's floor. Once main's floor moves past X.Y, release-X.Y stops following main and receives
# cherry-picked backports only (see CONTRIBUTING.md "Release branches, tags and backports").
#
# Pushes made with GITHUB_TOKEN don't start other workflows, so tag-release.yml doesn't run
# again for the release branch; the tag already exists from main's run at the same commit.

on:
  push:
    branches: ["main"]

permissions:
  contents: write

concurrency:
  group: advance-release-branches
  cancel-in-progress: false

jobs:
  advance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Fast-forward release branches at or above main's floor
        run: |
          set -euo pipefail
          v="$(jq -r '.version // empty' .claude-plugin/plugin.json)"
          [[ "$v" =~ ^[0-9]{4}\.([1-9][0-9]{2,})\.(0|[1-9][0-9]*)$ ]] || { echo "::error::version '$v' is not YYYY.DDD.N"; exit 1; }
          floor="${BASH_REMATCH[1]}"
          echo "main is $GITHUB_SHA at $v (floor $floor)"
          git fetch --quiet origin '+refs/heads/release-*:refs/remotes/origin/release-*' || true
          moved=0
          for ref in $(git for-each-ref --format='%(refname:strip=3)' 'refs/remotes/origin/release-*'); do
            [[ "$ref" =~ ^release-([0-9]+)\.([0-9]+)$ ]] || { echo "skip $ref: not release-X.Y"; continue; }
            code=$(( BASH_REMATCH[1] * 100 + BASH_REMATCH[2] ))
            if [ "$code" -lt "$floor" ]; then
              echo "skip $ref: line $code is below main's floor $floor, so it takes backports only"
              continue
            fi
            current="$(git rev-parse "refs/remotes/origin/$ref")"
            if [ "$current" = "$GITHUB_SHA" ]; then
              echo "$ref already at $GITHUB_SHA"; continue
            fi
            if ! git merge-base --is-ancestor "$current" "$GITHUB_SHA"; then
              echo "::error::$ref ($current) is not an ancestor of main ($GITHUB_SHA); it has commits main lacks. Resolve by hand: a branch at or above main's floor must equal main."
              exit 1
            fi
            git push origin "$GITHUB_SHA:refs/heads/$ref"
            echo "advanced $ref from $current to $GITHUB_SHA"
            moved=$((moved+1))
          done
          echo "advanced $moved branch(es)"
