name: Version check

# Enforces the plugin version scheme (YYYY.XYY.N, e.g. 2026.603.3) on pull requests.
# On the integration branch `develop` the version must stay equal to the base: releases are
# minted only by the develop -> main promotion PR, which carries the single bump.
# Any change under skills/, agents/, mcp-servers/, output-styles/, assets/, .mcp.json, mcp.json
# or either plugin.json must bump .claude-plugin/plugin.json "version", or nothing reaches
# installed copies: Claude Code caches plugins by that string. plugin.json must carry the same
# version (scripts/sync-manifests.py); the scheme is semver because the OpenAI portal requires it.
# See CONTRIBUTING.md "Release branches, tags and backports" and scripts/check-version.sh.

on:
  pull_request:
    branches: ["main", "develop", "release-*"]

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Fetch base and tags
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch --no-tags origin "+refs/heads/$BASE_REF:refs/remotes/origin/$BASE_REF"
          git fetch origin "+refs/tags/*:refs/tags/*"
      - name: Check plugin.json version against base
        env:
          BASE_REF: ${{ github.base_ref }}
        run: scripts/check-version.sh "origin/$BASE_REF"
      - name: Validate plugin manifests
        run: |
          jq -e '.name and .version and .description' .claude-plugin/plugin.json >/dev/null
          echo "plugin.json parses; version $(jq -r .version .claude-plugin/plugin.json)"
          python3 scripts/sync-manifests.py --check

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install PyYAML
        run: |
          python3 -c "import yaml" 2>/dev/null \
            || python3 -m pip install --quiet --user --break-system-packages pyyaml
      - name: Lint skills and build the OpenAI package
        run: scripts/build-openai.sh
