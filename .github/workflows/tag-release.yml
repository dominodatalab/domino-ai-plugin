name: Tag release

# On every push to main or a release-X.Y branch, create the tag
#   release-<plugin.json version>        e.g. release-2026.603.3
# if it does not exist yet, then publish a GitHub Release from it. The tag is derived from
# the manifest, so tag, Release and manifest always agree. Branch names stay release-X.Y
# because the Domino DSE update script resolves them by exact name; tags are the per-release
# labels an admin can pin to.
#
# Releases matter to installers: Gemini CLI installs and updates from the repository's
# "latest" Release once one exists, and `gh skill install` prefers the latest Release. So only
# releases from main are marked latest; a backport on release-X.Y never is, or default users
# would be moved onto the backport line. No files are attached: a Release with exactly one
# attached file is installed by Gemini CLI as if that file were the extension.

on:
  push:
    branches: ["main", "release-*"]
    paths:
      - ".claude-plugin/plugin.json"
      - "skills/**"
      - "agents/**"
      - "mcp-servers/**"
      - "output-styles/**"
      - "assets/**"
      - "hooks/**"
      - "bin/**"
      - "workflows/**"
      - "themes/**"
      - "monitors/**"
      - ".mcp.json"
      - "mcp.json"
      - ".lsp.json"
      - "settings.json"
      - "plugin.json"

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Read version
        id: v
        run: |
          v="$(jq -r '.version // empty' .claude-plugin/plugin.json)"
          [ -n "$v" ] || { echo "::error::plugin.json has no version"; exit 1; }
          [[ "$v" =~ ^[0-9]{4}\.([1-9][0-9]{2,})\.(0|[1-9][0-9]*)$ ]] || { echo "::error::version '$v' is not YYYY.XYY.N"; exit 1; }
          line="${BASH_REMATCH[1]}"
          if [[ "$GITHUB_REF_NAME" =~ ^release-([0-9]+)\.([0-9]+)$ ]] \
             && [ "$(( BASH_REMATCH[1] * 100 + BASH_REMATCH[2] ))" != "$line" ]; then
            echo "::error::branch $GITHUB_REF_NAME carries version $v; its line must match the branch"; exit 1
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "tag=release-$v" >> "$GITHUB_OUTPUT"
      - name: Create tag if absent
        env:
          TAG: ${{ steps.v.outputs.tag }}
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          git fetch origin "+refs/tags/*:refs/tags/*"
          if git rev-parse --verify --quiet "refs/tags/$TAG" >/dev/null; then
            existing="$(git rev-list -n1 "$TAG")"
            if [ "$existing" = "$GITHUB_SHA" ]; then
              echo "$TAG already points at $GITHUB_SHA; nothing to do"; exit 0
            fi
            echo "::error::$TAG already exists at $existing but this push is $GITHUB_SHA. Two changes landed with the same version. Recover with a bump-only PR to the next N; do not move or delete the existing tag. See CONTRIBUTING.md 'Release branches, tags and backports'."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "domino-ai-plugin $VERSION (${GITHUB_REF_NAME})" "$GITHUB_SHA"
          git push origin "refs/tags/$TAG"
          echo "created $TAG at $GITHUB_SHA"
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.v.outputs.tag }}
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG already exists; nothing to do"; exit 0
          fi
          code="$(cut -d. -f2 <<<"$VERSION")"
          line="$(( 10#$code / 100 )).$(( 10#$code % 100 ))"
          if [ "$GITHUB_REF_NAME" = "main" ]; then latest=true; else latest=false; fi
          gh release create "$TAG" --verify-tag --title "$VERSION" --latest="$latest" \
            --notes "domino-ai-plugin $VERSION for Domino $line and later, including Domino Cloud. Built from \`${GITHUB_REF_NAME}\` at ${GITHUB_SHA}. See the repository README for installation in Claude Code, Codex, ChatGPT and Gemini CLI."
          echo "published release $TAG (latest=$latest)"
