name: MCP server tests

# Unit tests of the bundled MCP server (mocked HTTP, fake clock; no Domino needed). Runs on pull
# requests that touch mcp-servers/. The test command is the one documented in
# mcp-servers/domino_mcp_server/README.md; pytest is deliberately not a project dependency.

on:
  pull_request:
    paths: ["mcp-servers/**"]

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: Run the MCP server unit tests
        run: cd mcp-servers/domino_mcp_server && uv run -q --with pytest pytest -q tests
