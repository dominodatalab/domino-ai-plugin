name: MCP server tests

# Unit tests of the bundled MCP server (mocked HTTP, fake clock; no Domino needed). Runs on pull
# requests that touch mcp-servers/ or rules/domino.md, whose lead section the server sends as its
# MCP instructions at runtime. The test command is the one documented in
# mcp-servers/domino_mcp_server/README.md; pytest is deliberately not a project dependency.

on:
  pull_request:
    paths: ["mcp-servers/**", "rules/domino.md"]

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - name: Run the MCP server unit tests
        run: cd mcp-servers/domino_mcp_server && uv run -q --with pytest pytest -q tests
